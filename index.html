<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>形容詞反義詞學習遊戲</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #a8edd8 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #game-card {
      width: 94vw;
      max-width: 920px;
      height: 90vh;
      max-height: 680px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      border: 6px solid #4A90E2;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #4A90E2;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .btn-header {
      background: #FF9F43;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s;
    }
    .btn-header:active {
      transform: scale(0.95);
    }
    
    /* MENU SCREEN */
    #menu-screen {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #menu-screen h1 {
      color: #2C3E50;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }
    #menu-screen p {
      color: #7F8C8D;
      margin-bottom: 20px;
    }
    .pair-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 720px;
    }
    @media (max-width: 600px) {
      .pair-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .pair-btn {
      background: #F8F9FA;
      border: 3px solid #E9ECEF;
      border-radius: 16px;
      padding: 18px 10px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #2C3E50;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pair-btn.selected {
      border-color: #2ECC71;
      background: #E8F8F5;
      color: #27AE60;
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(46, 204, 113, 0.2);
    }
    .start-btn {
      margin-top: 25px;
      background: #2ECC71;
      color: white;
      border: none;
      padding: 12px 40px;
      font-size: 1.4rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
    }
    .start-btn:disabled {
      background: #BDC3C7;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* PLAY AREA */
    #play-screen {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: #FAFAFA;
    }
    .instruction-banner {
      background: #FEF9E7;
      border: 2px dashed #F1C40F;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 1.3rem;
      color: #D35400;
      font-weight: bold;
      text-align: center;
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 10;
    }
    .trial-counter {
      background: #FF9F43;
      color: white;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 1rem;
    }

    .drop-targets-container {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: relative;
    }
    .target-box {
      width: 44%;
      height: 92%;
      border: 4px dashed #CBD5E0;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      position: relative;
      transition: background 0.2s, border-color 0.2s;
    }
    .target-box.hovered {
      background: #EBF8FF;
      border-color: #3182CE;
    }
    .target-img-container {
      width: 90%;
      height: 90%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .target-img-container img, .target-img-container svg {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .draggable-source-area {
      height: 120px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      background: #EDF2F7;
      border-radius: 16px;
      padding: 10px;
      z-index: 10;
    }
    .draggable-item {
      width: 95px;
      height: 95px;
      background: white;
      border: 3px solid #CBD5E0;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      touch-action: none;
      position: relative;
      z-index: 10;
    }
    .draggable-item:active {
      cursor: grabbing;
    }
    .draggable-item img, .draggable-item svg {
      width: 85%;
      height: 85%;
      pointer-events: none;
      object-fit: contain;
    }

    /* CANVAS FOR ROUTE DRAWING (遠近) */
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      touch-action: none;
      pointer-events: none;
      display: none;
    }

    /* ROUTE DRAWING NEXT BUTTON */
    .draw-next-btn {
      background: #3182CE;
      color: white;
      border: none;
      padding: 12px 35px;
      font-size: 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.4);
      z-index: 12;
      transition: transform 0.1s;
    }
    .draw-next-btn:active {
      transform: scale(0.95);
    }

    /* MODAL POPUP */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: white;
      padding: 35px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-content h2 {
      font-size: 2.2rem;
      color: #2ECC71;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div id="game-card">
  <header>
    <span>形容詞反義詞學習遊戲</span>
    <button class="btn-header" onclick="showMenu()">選擇目標</button>
  </header>

  <!-- SELECTION MENU -->
  <div id="menu-screen">
    <h1>請選擇練習的形容詞對 (單選)</h1>
    <p>選好後點擊「開始遊戲」即可進行 5 次練習！</p>
    <div class="pair-grid">
      <button class="pair-btn" data-pair="凍熱" onclick="selectSinglePair(this)">凍 / 熱</button>
      <button class="pair-btn" data-pair="多少" onclick="selectSinglePair(this)">多 / 少</button>
      <button class="pair-btn" data-pair="長短" onclick="selectSinglePair(this)">長 / 短</button>
      <button class="pair-btn" data-pair="高矮" onclick="selectSinglePair(this)">高 / 矮</button>
      <button class="pair-btn" data-pair="肥瘦" onclick="selectSinglePair(this)">肥 / 瘦</button>
      <button class="pair-btn" data-pair="遠近" onclick="selectSinglePair(this)">遠 / 近</button>
      <button class="pair-btn" data-pair="厚薄" onclick="selectSinglePair(this)">厚 / 薄</button>
    </div>
    <button class="start-btn" id="start-btn" disabled onclick="startGame()">開始遊戲</button>
  </div>

  <!-- PLAY SCREEN -->
  <div id="play-screen" style="display: none;">
    <div class="instruction-banner">
      <span class="trial-counter" id="trial-counter">1 / 5</span>
      <span id="instruction-text">配對正確的物件吧！</span>
    </div>

    <canvas id="draw-canvas"></canvas>

    <div class="drop-targets-container" id="targets-container">
      <!-- Target boxes rendered dynamically -->
    </div>

    <div class="draggable-source-area" id="source-area">
      <!-- Draggable items rendered dynamically -->
    </div>
  </div>

  <!-- SUCCESS POPUP -->
  <div class="modal" id="success-modal">
    <div class="modal-content">
      <h2 id="modal-title">🎉 完成了！你太棒了！</h2>
      <button class="start-btn" id="modal-btn" onclick="nextQuestion()">下一題</button>
    </div>
  </div>
</div>

<script>
  let selectedTarget = null;
  let currentTrialCount = 0;
  const maxTrials = 5;
  let solvedCount = 0;
  let hasDrawnLine = false;

  // 10 ITEMS FOR COLD/HOT (5 COLD: 7.png-11.png, 5 HOT: 12.png-16.png)
  const coldItemPool = [
    { imgSrc: '7.png', key: 'jacket' },
    { imgSrc: '8.png', key: 'scarf' },
    { imgSrc: '9.png', key: 'gloves' },
    { imgSrc: '10.png', key: 'beanie' },
    { imgSrc: '11.png', key: 'earmuffs' }
  ];

  const hotItemPool = [
    { imgSrc: '12.png', key: 'fan' },
    { imgSrc: '13.png', key: 'ice_stick' },
    { imgSrc: '14.png', key: 'cold_drink' },
    { imgSrc: '15.png', key: 'towel' },
    { imgSrc: '16.png', key: 'air_con' }
  ];

  // 10 ITEMS FOR 多少 (5 LARGE: 19.png-23.png, 5 SMALL: 24.png-28.png)
  const largeFoodPool = [
    { imgSrc: '19.png', key: 'large_pizza' },
    { imgSrc: '20.png', key: 'large_noodles' },
    { imgSrc: '21.png', key: 'large_fruit' },
    { imgSrc: '22.png', key: 'large_sushi' },
    { imgSrc: '23.png', key: 'large_burger' }
  ];

  const smallFoodPool = [
    { imgSrc: '24.png', key: 'small_pizza' },
    { imgSrc: '25.png', key: 'small_noodles' },
    { imgSrc: '26.png', key: 'small_fruit' },
    { imgSrc: '27.png', key: 'small_sushi' },
    { imgSrc: '28.png', key: 'small_burger' }
  ];

  // EXEMPLAR DATA POOL FOR 長短, 高矮, 肥瘦
  const exemplarPool = {
    '長短': [
      { name: '直尺', targetLongImg: '33.png', targetShortImg: '34.png', longImg: '35.png', shortImg: '36.png', longKey: 'long_ruler', shortKey: 'short_ruler' },
      { name: '鉛筆', targetLongImg: '37.png', targetShortImg: '38.png', longImg: '39.png', shortImg: '40.png', longKey: 'long_pencil', shortKey: 'short_pencil' },
      { name: '蛇', targetLongImg: '41.png', targetShortImg: '42.png', longImg: '43.png', shortImg: '44.png', longKey: 'long_snake', shortKey: 'short_snake' }
    ],
    '高矮': [
      { name: '動物', targetTallImg: '45.png', targetShortImg: '46.png', tallImg: '47.png', shortImg: '48.png', tallKey: 'tall_giraffe', shortKey: 'short_dog' },
      { name: '植物', targetTallImg: '49.png', targetShortImg: '50.png', tallImg: '51.png', shortImg: '52.png', tallKey: 'tall_tree', shortKey: 'short_grass' },
      { name: '建築物', targetTallImg: '53.png', targetShortImg: '54.png', tallImg: '55.png', shortImg: '56.png', tallKey: 'tall_building', shortKey: 'short_house' }
    ],
    '肥瘦': [
      { name: '動物1', targetFatImg: '57.png', targetThinImg: '58.png', fatImg: '59.png', thinImg: '60.png', fatKey: 'fat_elephant', thinKey: 'thin_cheetah' },
      { name: '動物2', targetFatImg: '61.png', targetThinImg: '62.png', fatImg: '63.png', thinImg: '64.png', fatKey: 'fat_bear', thinKey: 'thin_cat' },
      { name: '人物', targetFatImg: '65.png', targetThinImg: '66.png', fatImg: '67.png', thinImg: '68.png', fatKey: 'fat_sumo', thinKey: 'thin_runner' }
    ]
  };

  // SVG FALLBACK GRAPHICS
  function getFallbackSVG(key) {
    const svgs = {
      'cold_person': `<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="#A0AEC0"/><path d="M 35 40 Q 50 30 65 40" stroke="#2B6CB0" stroke-width="4" fill="none"/></svg>`,
      'hot_person': `<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="#ED8936"/></svg>`,
      'cold_item': `<svg viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="60" rx="10" fill="#63B3ED"/></svg>`,
      'hot_item': `<svg viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="60" rx="10" fill="#F6AD55"/></svg>`,

      'fat_monster': `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="40" ry="35" fill="#9F7AEA"/></svg>`,
      'thin_monster': `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="20" ry="35" fill="#ED64A6"/></svg>`,
      'large_food': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#F6AD55"/></svg>`,
      'small_food': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="15" fill="#F6AD55"/></svg>`,

      'big_mouth_monster': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#48BB78"/></svg>`,
      'small_mouth_monster': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#ECC94B"/></svg>`,
      'thick_book': `<svg viewBox="0 0 100 100"><rect x="30" y="20" width="40" height="60" rx="4" fill="#3182CE"/></svg>`,
      'thin_book': `<svg viewBox="0 0 100 100"><rect x="42" y="20" width="16" height="60" rx="2" fill="#E53E3E"/></svg>`,

      'near_house': `<svg viewBox="0 0 100 100"><polygon points="50,15 15,45 85,45" fill="#4299E1"/><rect x="25" y="45" width="50" height="40" fill="#EBF8FF"/></svg>`,
      'far_house': `<svg viewBox="0 0 100 100"><polygon points="50,15 15,45 85,45" fill="#E53E3E"/><rect x="25" y="45" width="50" height="40" fill="#FEFCBF"/></svg>`,
      'person': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill="#3182CE"/></svg>`
    };

    if (svgs[key]) return svgs[key];
    return `<div style="width:60px; height:60px; background:#E2E8F0; border-radius:12px;"></div>`;
  }

  function createImageElement(fileSrc, fallbackKey) {
    const img = document.createElement('img');
    img.src = fileSrc;
    img.alt = "";
    img.onerror = function() {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = getFallbackSVG(fallbackKey);
      this.replaceWith(wrapper.firstElementChild);
    };
    return img;
  }

  // SINGLE SELECT TOGGLE
  function selectSinglePair(btn) {
    document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedTarget = btn.getAttribute('data-pair');
    document.getElementById('start-btn').disabled = false;
  }

  function showMenu() {
    document.getElementById('menu-screen').style.display = 'flex';
    document.getElementById('play-screen').style.display = 'none';
  }

  function startGame() {
    currentTrialCount = 0;
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('play-screen').style.display = 'flex';
    nextQuestion();
  }

  // GAME GENERATOR
  function nextQuestion() {
    document.getElementById('success-modal').classList.remove('show');
    clearCanvas();

    currentTrialCount++;
    if (currentTrialCount > maxTrials) {
      showMenu();
      return;
    }

    document.getElementById('trial-counter').innerText = `${currentTrialCount} / ${maxTrials}`;

    const targetsContainer = document.getElementById('targets-container');
    const sourceArea = document.getElementById('source-area');
    targetsContainer.innerHTML = '';
    sourceArea.innerHTML = '';

    const isSwapped = Math.random() > 0.5;

    if (selectedTarget === '凍熱') {
      const coldCharIdx = Math.floor(Math.random() * 3) + 1;
      const hotCharIdx = Math.floor(Math.random() * 3) + 4;

      const selectedColdItem = coldItemPool[Math.floor(Math.random() * coldItemPool.length)];
      const selectedHotItem = hotItemPool[Math.floor(Math.random() * hotItemPool.length)];

      setupDragMatching({
        instruction: '幫凍同熱嘅人拖放合適嘅物品啦！',
        targetA: { id: 'hot', imgSrc: `${hotCharIdx}.png`, key: 'hot_person', accepts: 'hot_item' },
        targetB: { id: 'cold', imgSrc: `${coldCharIdx}.png`, key: 'cold_person', accepts: 'cold_item' },
        items: [
          { id: 'hot_item', imgSrc: selectedHotItem.imgSrc, key: 'hot_item' },
          { id: 'cold_item', imgSrc: selectedColdItem.imgSrc, key: 'cold_item' }
        ],
        isSwapped
      });
    } 
    else if (selectedTarget === '多少') {
      const selectedLargeFood = largeFoodPool[Math.floor(Math.random() * largeFoodPool.length)];
      const selectedSmallFood = smallFoodPool[Math.floor(Math.random() * smallFoodPool.length)];

      setupDragMatching({
        instruction: '把多嘅食物給大胃怪，少嘅食物給小胃怪！',
        targetA: { id: 'fat', imgSrc: '17.png', key: 'fat_monster', accepts: 'large_food' },
        targetB: { id: 'thin', imgSrc: '18.png', key: 'thin_monster', accepts: 'small_food' },
        items: [
          { id: 'large_food', imgSrc: selectedLargeFood.imgSrc, key: 'large_food' },
          { id: 'small_food', imgSrc: selectedSmallFood.imgSrc, key: 'small_food' }
        ],
        isSwapped
      });
    } 
    else if (selectedTarget === '厚薄') {
      setupDragMatching({
        instruction: '大嘴怪吃厚書，小嘴怪吃薄書！',
        targetA: { id: 'big_mouth', imgSrc: '29.png', key: 'big_mouth_monster', accepts: 'thick_book' },
        targetB: { id: 'small_mouth', imgSrc: '30.png', key: 'small_mouth_monster', accepts: 'thin_book' },
        items: [
          { id: 'thick_book', imgSrc: '31.png', key: 'thick_book' },
          { id: 'thin_book', imgSrc: '32.png', key: 'thin_book' }
        ],
        isSwapped
      });
    } 
    else if (selectedTarget === '長短') {
      const itemData = exemplarPool['長短'][Math.floor(Math.random() * exemplarPool['長短'].length)];
      setupDragMatching({
        instruction: `將「長」同「短」放對位置！`,
        targetA: { id: 'long', imgSrc: itemData.targetLongImg, key: 'target_long', accepts: 'long_item' },
        targetB: { id: 'short', imgSrc: itemData.targetShortImg, key: 'target_short', accepts: 'short_item' },
        items: [
          { id: 'long_item', imgSrc: itemData.longImg, key: itemData.longKey },
          { id: 'short_item', imgSrc: itemData.shortImg, key: itemData.shortKey }
        ],
        isSwapped
      });
    } 
    else if (selectedTarget === '高矮') {
      const itemData = exemplarPool['高矮'][Math.floor(Math.random() * exemplarPool['高矮'].length)];
      setupDragMatching({
        instruction: `將「高」同「矮」放對位置！`,
        targetA: { id: 'tall', imgSrc: itemData.targetTallImg, key: 'target_tall', accepts: 'tall_item' },
        targetB: { id: 'short', imgSrc: itemData.targetShortImg, key: 'target_short', accepts: 'short_item' },
        items: [
          { id: 'tall_item', imgSrc: itemData.tallImg, key: itemData.tallKey },
          { id: 'short_item', imgSrc: itemData.shortImg, key: itemData.shortKey }
        ],
        isSwapped
      });
    } 
    else if (selectedTarget === '肥瘦') {
      const itemData = exemplarPool['肥瘦'][Math.floor(Math.random() * exemplarPool['肥瘦'].length)];
      setupDragMatching({
        instruction: `將「肥」同「瘦」放對位置！`,
        targetA: { id: 'fat', imgSrc: itemData.targetFatImg, key: 'target_fat', accepts: 'fat_item' },
        targetB: { id: 'thin', imgSrc: itemData.targetThinImg, key: 'target_thin', accepts: 'thin_item' },
        items: [
          { id: 'fat_item', imgSrc: itemData.fatImg, key: itemData.fatKey },
          { id: 'thin_item', imgSrc: itemData.thinImg, key: itemData.thinKey }
        ],
        isSwapped
      });
    } 
    else if (selectedTarget === '遠近') {
      setupRouteDrawingTrial();
    }
  }

  // DRAG AND DROP ENGINE
  function setupDragMatching(config) {
    solvedCount = 0;
    document.getElementById('instruction-text').innerText = config.instruction;

    const canvas = document.getElementById('draw-canvas');
    canvas.style.display = 'none';
    canvas.style.pointerEvents = 'none';

    const targetsContainer = document.getElementById('targets-container');
    const sourceArea = document.getElementById('source-area');

    const tA = config.targetA;
    const tB = config.targetB;
    const targets = config.isSwapped ? [tB, tA] : [tA, tB];

    targets.forEach(t => {
      const box = document.createElement('div');
      box.className = 'target-box';
      box.dataset.accepts = t.accepts;

      const imgWrapper = document.createElement('div');
      imgWrapper.className = 'target-img-container';
      imgWrapper.appendChild(createImageElement(t.imgSrc, t.key));

      box.appendChild(imgWrapper);
      targetsContainer.appendChild(box);
    });

    const shuffledItems = [...config.items].sort(() => Math.random() - 0.5);
    shuffledItems.forEach(item => {
      const dragEl = document.createElement('div');
      dragEl.className = 'draggable-item';
      dragEl.dataset.type = item.accepts || item.id;
      dragEl.appendChild(createImageElement(item.imgSrc, item.key));
      
      makeDraggable(dragEl);
      sourceArea.appendChild(dragEl);
    });
  }

  function makeDraggable(el) {
    let startX = 0, startY = 0;

    const onStart = (e) => {
      e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      startX = clientX;
      startY = clientY;

      const rect = el.getBoundingClientRect();
      el.style.position = 'fixed';
      el.style.left = rect.left + 'px';
      el.style.top = rect.top + 'px';

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
    };

    const onMove = (e) => {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dx = clientX - startX;
      const dy = clientY - startY;

      el.style.transform = `translate(${dx}px, ${dy}px)`;

      const boxes = document.querySelectorAll('.target-box');
      boxes.forEach(box => {
        const boxRect = box.getBoundingClientRect();
        if (clientX >= boxRect.left && clientX <= boxRect.right &&
            clientY >= boxRect.top && clientY <= boxRect.bottom) {
          box.classList.add('hovered');
        } else {
          box.classList.remove('hovered');
        }
      });
    };

    const onEnd = (e) => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);

      const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

      let droppedOnCorrect = false;
      const boxes = document.querySelectorAll('.target-box');

      boxes.forEach(box => {
        box.classList.remove('hovered');
        const boxRect = box.getBoundingClientRect();
        if (clientX >= boxRect.left && clientX <= boxRect.right &&
            clientY >= boxRect.top && clientY <= boxRect.bottom) {
          
          if (box.dataset.accepts === el.dataset.type) {
            droppedOnCorrect = true;
            box.appendChild(el);
            el.style.position = 'static';
            el.style.transform = 'none';
            el.style.pointerEvents = 'none';
            solvedCount++;

            if (solvedCount >= 2) {
              setTimeout(triggerCompletion, 400);
            }
          }
        }
      });

      if (!droppedOnCorrect) {
        el.style.position = 'static';
        el.style.transform = 'none';
      }
    };

    el.addEventListener('mousedown', onStart);
    el.addEventListener('touchstart', onStart, { passive: false });
  }

  // 遠近 ROUTE DRAWING (With manual "Next Trial" button)
  function setupRouteDrawingTrial() {
    hasDrawnLine = false;
    const instruction = '畫一條路線回家！體會「遠」同「近」！';
    document.getElementById('instruction-text').innerText = instruction;

    const canvas = document.getElementById('draw-canvas');
    canvas.style.display = 'block';
    canvas.style.pointerEvents = 'auto';

    const targetsContainer = document.getElementById('targets-container');
    const sourceArea = document.getElementById('source-area');

    targetsContainer.innerHTML = `
      <div style="display:flex; justify-content:space-between; width:100%; height:100%; align-items:center; padding: 20px;">
        <div id="near-house" style="text-align:center;">
          ${createImageElement('69.png', 'near_house').outerHTML}
        </div>
        <div id="person-center" style="text-align:center;">
          ${createImageElement('70.png', 'person').outerHTML}
        </div>
        <div id="far-house" style="text-align:center;">
          ${createImageElement('71.png', 'far_house').outerHTML}
        </div>
      </div>
    `;

    // Render "下一題" button in bottom area for 遠近
    const btnText = currentTrialCount >= maxTrials ? "完成" : "下一題 ➔";
    sourceArea.innerHTML = `<button class="draw-next-btn" id="route-next-btn" onclick="triggerCompletion()">${btnText}</button>`;

    initCanvas();
  }

  function initCanvas() {
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    let drawing = false;

    const startDraw = (e) => {
      drawing = true;
      hasDrawnLine = true;
      ctx.beginPath();
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      ctx.moveTo(x, y);
    };

    const draw = (e) => {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      ctx.lineTo(x, y);
      ctx.strokeStyle = '#FF9F43';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.stroke();
    };

    const endDraw = () => {
      drawing = false;
    };

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endEndDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    function endEndDraw() {
      drawing = false;
    }
  }

  function clearCanvas() {
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // TRIGGER CELEBRATORY COMPLETION POPUP
  function triggerCompletion() {
    const modalBtn = document.getElementById('modal-btn');
    if (currentTrialCount >= maxTrials) {
      document.getElementById('modal-title').innerText = "🎉 完成了！你太棒了！";
      modalBtn.innerText = "返回主選單";
    } else {
      document.getElementById('modal-title').innerText = "🎉 完成了！你太棒了！";
      modalBtn.innerText = "下一題 ➔";
    }
    document.getElementById('success-modal').classList.add('show');
  }
</script>
