<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>形容詞反義詞學習遊戲</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #a8edd8 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #game-card {
      width: 94vw;
      max-width: 920px;
      height: 90vh;
      max-height: 680px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      border: 6px solid #4A90E2;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #4A90E2;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .btn-header {
      background: #FF9F43;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s;
    }
    .btn-header:active {
      transform: scale(0.95);
    }
    
    /* MENU SCREEN */
    #menu-screen {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #menu-screen h1 {
      color: #2C3E50;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }
    #menu-screen p {
      color: #7F8C8D;
      margin-bottom: 20px;
    }
    .pair-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 720px;
    }
    @media (max-width: 600px) {
      .pair-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .pair-btn {
      background: #F8F9FA;
      border: 3px solid #E9ECEF;
      border-radius: 16px;
      padding: 15px 10px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2C3E50;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .pair-btn.selected {
      border-color: #2ECC71;
      background: #E8F8F5;
      color: #27AE60;
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(46, 204, 113, 0.2);
    }
    .start-btn {
      margin-top: 25px;
      background: #2ECC71;
      color: white;
      border: none;
      padding: 12px 40px;
      font-size: 1.4rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 6px 15px rgba(46, 204, 113, 0.4);
    }
    .start-btn:disabled {
      background: #BDC3C7;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* PLAY AREA */
    #play-screen {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: #FAFAFA;
    }
    .instruction-banner {
      background: #FEF9E7;
      border: 2px dashed #F1C40F;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 1.3rem;
      color: #D35400;
      font-weight: bold;
      text-align: center;
    }

    .drop-targets-container {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: relative;
    }
    .target-box {
      width: 44%;
      height: 90%;
      border: 4px dashed #CBD5E0;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      position: relative;
      transition: background 0.2s, border-color 0.2s;
    }
    .target-box.hovered {
      background: #EBF8FF;
      border-color: #3182CE;
    }
    .target-img-container {
      width: 85%;
      height: 75%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .target-img-container img, .target-img-container svg {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .target-label {
      font-size: 1.3rem;
      font-weight: bold;
      color: #4A5568;
      margin-top: 6px;
    }

    .draggable-source-area {
      height: 120px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      background: #EDF2F7;
      border-radius: 16px;
      padding: 10px;
    }
    .draggable-item {
      width: 95px;
      height: 95px;
      background: white;
      border: 3px solid #CBD5E0;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      touch-action: none;
      position: relative;
      z-index: 10;
    }
    .draggable-item:active {
      cursor: grabbing;
    }
    .draggable-item img, .draggable-item svg {
      width: 85%;
      height: 85%;
      pointer-events: none;
      object-fit: contain;
    }

    /* CANVAS FOR ROUTE DRAWING (遠近) */
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      touch-action: none;
    }

    /* MODAL POPUP */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-content h2 {
      font-size: 2rem;
      color: #2ECC71;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div id="game-card">
  <header>
    <span>形容詞反義詞學習遊戲</span>
    <button class="btn-header" onclick="showMenu()">⚙️ 選擇目標</button>
  </header>

  <!-- SELECTION MENU -->
  <div id="menu-screen">
    <h1>請選擇練習的形容詞對 (可多選)</h1>
    <p>選好後點擊「開始遊戲」即可開始訓練！</p>
    <div class="pair-grid">
      <button class="pair-btn" data-pair="凍熱" onclick="togglePair(this)">🔥/🧊 凍 / 熱</button>
      <button class="pair-btn" data-pair="多少" onclick="togglePair(this)">🥣/🍲 多 / 少</button>
      <button class="pair-btn" data-pair="長短" onclick="togglePair(this)">📏 長 / 短</button>
      <button class="pair-btn" data-pair="高矮" onclick="togglePair(this)">🦒/🐕 高 / 矮</button>
      <button class="pair-btn" data-pair="肥瘦" onclick="togglePair(this)">🐘/🐆 肥 / 瘦</button>
      <button class="pair-btn" data-pair="遠近" onclick="togglePair(this)">🏠 遠 / 近</button>
      <button class="pair-btn" data-pair="厚薄" onclick="togglePair(this)">📚 厚 / 薄</button>
    </div>
    <button class="start-btn" id="start-btn" disabled onclick="startGame()">🚀 開始遊戲</button>
  </div>

  <!-- PLAY SCREEN -->
  <div id="play-screen" style="display: none;">
    <div class="instruction-banner">
      <span id="instruction-text">配對正確的物件吧！</span>
    </div>

    <canvas id="draw-canvas"></canvas>

    <div class="drop-targets-container" id="targets-container">
      <!-- Target boxes rendered dynamically -->
    </div>

    <div class="draggable-source-area" id="source-area">
      <!-- Draggable items rendered dynamically -->
    </div>
  </div>

  <!-- SUCCESS POPUP -->
  <div class="modal" id="success-modal">
    <div class="modal-content">
      <h2>🎉 答對了！好棒喔！</h2>
      <button class="start-btn" onclick="nextQuestion()">下一題 ➔</button>
    </div>
  </div>
</div>

<script>
  let selectedPairs = [];
  let currentPairQueue = [];
  let currentTrial = null;
  let solvedCount = 0;

  // 10 ITEMS FOR COLD/HOT (5 COLD: 7.png-11.png, 5 HOT: 12.png-16.png)
  const coldItemPool = [
    { imgSrc: '7.png', label: '厚外套', key: 'jacket' },
    { imgSrc: '8.png', label: '圍巾', key: 'scarf' },
    { imgSrc: '9.png', label: '手套', key: 'gloves' },
    { imgSrc: '10.png', label: '毛線帽', key: 'beanie' },
    { imgSrc: '11.png', label: '耳罩', key: 'earmuffs' }
  ];

  const hotItemPool = [
    { imgSrc: '12.png', label: '風扇', key: 'fan' },
    { imgSrc: '13.png', label: '雪條', key: 'ice_stick' },
    { imgSrc: '14.png', label: '凍飲', key: 'cold_drink' },
    { imgSrc: '15.png', label: '毛巾', key: 'towel' },
    { imgSrc: '16.png', label: '冷氣機', key: 'air_con' }
  ];

  // 10 ITEMS FOR 多少 (5 LARGE: 19.png-23.png, 5 SMALL: 24.png-28.png)
  const largeFoodPool = [
    { imgSrc: '19.png', label: '多的披薩', key: 'large_pizza' },
    { imgSrc: '20.png', label: '多的面條', key: 'large_noodles' },
    { imgSrc: '21.png', label: '多的水果', key: 'large_fruit' },
    { imgSrc: '22.png', label: '多的壽司', key: 'large_sushi' },
    { imgSrc: '23.png', label: '多的漢堡', key: 'large_burger' }
  ];

  const smallFoodPool = [
    { imgSrc: '24.png', label: '少的披薩', key: 'small_pizza' },
    { imgSrc: '25.png', label: '少的面條', key: 'small_noodles' },
    { imgSrc: '26.png', label: '少的水果', key: 'small_fruit' },
    { imgSrc: '27.png', label: '少的壽司', key: 'small_sushi' },
    { imgSrc: '28.png', label: '少的漢堡', key: 'small_burger' }
  ];

  // EXEMPLAR DATA POOL FOR 長短, 高矮, 肥瘦
  const exemplarPool = {
    '長短': [
      { name: '直尺', longImg: '33.png', shortImg: '34.png', longKey: 'long_ruler', shortKey: 'short_ruler' },
      { name: '鉛筆', longImg: '35.png', shortImg: '36.png', longKey: 'long_pencil', shortKey: 'short_pencil' },
      { name: '蛇', longImg: '37.png', shortImg: '38.png', longKey: 'long_snake', shortKey: 'short_snake' },
      { name: '火車', longImg: '39.png', shortImg: '40.png', longKey: 'long_train', shortKey: 'short_train' },
      { name: '繩子', longImg: '41.png', shortImg: '42.png', longKey: 'long_rope', shortKey: 'short_rope' },
      { name: '頭髮', longImg: '43.png', shortImg: '44.png', longKey: 'long_hair', shortKey: 'short_hair' }
    ],
    '高矮': [
      { name: '長頸鹿/小狗', tallImg: '45.png', shortImg: '46.png', tallKey: 'tall_giraffe', shortKey: 'short_dog' },
      { name: '大樹/小草', tallImg: '47.png', shortImg: '48.png', tallKey: 'tall_tree', shortKey: 'short_grass' },
      { name: '高樓/平房', tallImg: '49.png', shortImg: '50.png', tallKey: 'tall_building', shortKey: 'short_house' },
      { name: '梯子/凳子', tallImg: '51.png', shortImg: '52.png', tallKey: 'tall_ladder', shortKey: 'short_stool' }
    ],
    '肥瘦': [
      { name: '大象/獵豹', fatImg: '53.png', thinImg: '54.png', fatKey: 'fat_elephant', thinKey: 'thin_cheetah' },
      { name: '胖熊/瘦貓', fatImg: '55.png', thinImg: '56.png', fatKey: 'fat_bear', thinKey: 'thin_cat' },
      { name: '相撲手/跑步員', fatImg: '57.png', thinImg: '58.png', fatKey: 'fat_sumo', thinKey: 'thin_runner' },
      { name: '胖豬/瘦公雞', fatImg: '59.png', thinImg: '60.png', fatKey: 'fat_pig', thinKey: 'thin_rooster' }
    ]
  };

  // SVG FALLBACK GRAPHICS
  function getFallbackSVG(key, label = '') {
    const svgs = {
      'cold_person': `<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="#A0AEC0"/><path d="M 35 40 Q 50 30 65 40" stroke="#2B6CB0" stroke-width="4" fill="none"/><text x="50" y="85" font-size="14" text-anchor="middle" fill="#2B6CB0">🥶 凍人</text></svg>`,
      'hot_person': `<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="25" fill="#ED8936"/><text x="50" y="85" font-size="14" text-anchor="middle" fill="#C53030">🥵 熱人</text></svg>`,
      'cold_item': `<svg viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="60" rx="10" fill="#63B3ED"/><text x="50" y="55" font-size="28" text-anchor="middle">🧥</text><text x="50" y="90" font-size="10" text-anchor="middle">${label}</text></svg>`,
      'hot_item': `<svg viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="60" rx="10" fill="#F6AD55"/><text x="50" y="55" font-size="28" text-anchor="middle">🌬️</text><text x="50" y="90" font-size="10" text-anchor="middle">${label}</text></svg>`,

      'fat_monster': `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="40" ry="35" fill="#9F7AEA"/><text x="50" y="95" font-size="12" text-anchor="middle">大胃怪 (多)</text></svg>`,
      'thin_monster': `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="20" ry="35" fill="#ED64A6"/><text x="50" y="95" font-size="12" text-anchor="middle">小胃怪 (少)</text></svg>`,
      'large_food': `<svg viewBox="0 0 100 100"><text x="50" y="55" font-size="28" text-anchor="middle">🍕🍕🍕</text><text x="50" y="90" font-size="10" text-anchor="middle">${label}</text></svg>`,
      'small_food': `<svg viewBox="0 0 100 100"><text x="50" y="55" font-size="22" text-anchor="middle">🍕</text><text x="50" y="90" font-size="10" text-anchor="middle">${label}</text></svg>`,

      'big_mouth_monster': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#48BB78"/><text x="50" y="95" font-size="12" text-anchor="middle">大嘴怪 (厚)</text></svg>`,
      'small_mouth_monster': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#ECC94B"/><text x="50" y="95" font-size="12" text-anchor="middle">小嘴怪 (薄)</text></svg>`,
      'thick_book': `<svg viewBox="0 0 100 100"><rect x="30" y="20" width="40" height="60" rx="4" fill="#3182CE"/><text x="50" y="95" font-size="12" text-anchor="middle">厚書</text></svg>`,
      'thin_book': `<svg viewBox="0 0 100 100"><rect x="42" y="20" width="16" height="60" rx="2" fill="#E53E3E"/><text x="50" y="95" font-size="12" text-anchor="middle">薄書</text></svg>`,

      'house': `<svg viewBox="0 0 100 100"><polygon points="50,15 15,45 85,45" fill="#E53E3E"/><rect x="25" y="45" width="50" height="40" fill="#FEFCBF"/><text x="50" y="95" font-size="12" text-anchor="middle">家</text></svg>`,
      'far_person': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="10" fill="#3182CE"/><text x="50" y="80" font-size="12" text-anchor="middle">遠的人</text></svg>`,
      'near_person': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="28" fill="#3182CE"/><text x="50" y="95" font-size="12" text-anchor="middle">近的人</text></svg>`
    };

    if (svgs[key]) return svgs[key];
    return `<div style="font-weight:bold; color:#4A5568; text-align:center;">${label}<br><small>(${key})</small></div>`;
  }

  function createImageElement(fileSrc, fallbackKey, altLabel) {
    const img = document.createElement('img');
    img.src = fileSrc;
    img.alt = altLabel;
    img.onerror = function() {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = getFallbackSVG(fallbackKey, altLabel);
      this.replaceWith(wrapper.firstElementChild);
    };
    return img;
  }

  // UI CONTROL
  function togglePair(btn) {
    const pair = btn.getAttribute('data-pair');
    if (selectedPairs.includes(pair)) {
      selectedPairs = selectedPairs.filter(p => p !== pair);
      btn.classList.remove('selected');
    } else {
      selectedPairs.push(pair);
      btn.classList.add('selected');
    }
    document.getElementById('start-btn').disabled = selectedPairs.length === 0;
  }

  function showMenu() {
    document.getElementById('menu-screen').style.display = 'flex';
    document.getElementById('play-screen').style.display = 'none';
  }

  function startGame() {
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('play-screen').style.display = 'flex';
    currentPairQueue = [...selectedPairs].sort(() => Math.random() - 0.5);
    nextQuestion();
  }

  // GAME GENERATOR
  function nextQuestion() {
    document.getElementById('success-modal').classList.remove('show');
    clearCanvas();

    if (currentPairQueue.length === 0) {
      currentPairQueue = [...selectedPairs].sort(() => Math.random() - 0.5);
    }
    const currentPair = currentPairQueue.shift();
    
    const targetsContainer = document.getElementById('targets-container');
    const sourceArea = document.getElementById('source-area');
    targetsContainer.innerHTML = '';
    sourceArea.innerHTML = '';

    const isSwapped = Math.random() > 0.5;

    if (currentPair === '凍熱') {
      const coldCharIdx = Math.floor(Math.random() * 3) + 1; // 1.png - 3.png
      const hotCharIdx = Math.floor(Math.random() * 3) + 4;  // 4.png - 6.png

      const selectedColdItem = coldItemPool[Math.floor(Math.random() * coldItemPool.length)];
      const selectedHotItem = hotItemPool[Math.floor(Math.random() * hotItemPool.length)];

      setupDragMatching({
        instruction: '幫凍同熱嘅人拖放合適嘅物品啦！',
        targetA: { id: 'hot', label: '熱', imgSrc: `${hotCharIdx}.png`, key: 'hot_person', accepts: 'hot_item' },
        targetB: { id: 'cold', label: '凍', imgSrc: `${coldCharIdx}.png`, key: 'cold_person', accepts: 'cold_item' },
        items: [
          { id: 'hot_item', imgSrc: selectedHotItem.imgSrc, key: 'hot_item', label: selectedHotItem.label },
          { id: 'cold_item', imgSrc: selectedColdItem.imgSrc, key: 'cold_item', label: selectedColdItem.label }
        ],
        isSwapped
      });
    } 
    else if (currentPair === '多少') {
      // Pick 1 random large portion food (19.png-23.png) & 1 random small portion food (24.png-28.png)
      const selectedLargeFood = largeFoodPool[Math.floor(Math.random() * largeFoodPool.length)];
      const selectedSmallFood = smallFoodPool[Math.floor(Math.random() * smallFoodPool.length)];

      setupDragMatching({
        instruction: '把多嘅食物給大胃怪，少嘅食物給小胃怪！',
        targetA: { id: 'fat', label: '多 (大胃怪)', imgSrc: '17.png', key: 'fat_monster', accepts: 'large_food' },
        targetB: { id: 'thin', label: '少 (小胃怪)', imgSrc: '18.png', key: 'thin_monster', accepts: 'small_food' },
        items: [
          { id: 'large_food', imgSrc: selectedLargeFood.imgSrc, key: 'large_food', label: selectedLargeFood.label },
          { id: 'small_food', imgSrc: selectedSmallFood.imgSrc, key: 'small_food', label: selectedSmallFood.label }
        ],
        isSwapped
      });
    } 
    else if (currentPair === '厚薄') {
      setupDragMatching({
        instruction: '大嘴怪吃厚書，小嘴怪吃薄書！',
        targetA: { id: 'big_mouth', label: '厚 (大嘴怪)', imgSrc: '29.png', key: 'big_mouth_monster', accepts: 'thick_book' },
        targetB: { id: 'small_mouth', label: '薄 (小嘴怪)', imgSrc: '30.png', key: 'small_mouth_monster', accepts: 'thin_book' },
        items: [
          { id: 'thick_book', imgSrc: '31.png', key: 'thick_book', label: '厚書' },
          { id: 'thin_book', imgSrc: '32.png', key: 'thin_book', label: '薄書' }
        ],
        isSwapped
      });
    } 
    else if (currentPair === '長短') {
      const itemData = exemplarPool['長短'][Math.floor(Math.random() * exemplarPool['長短'].length)];
      setupDragMatching({
        instruction: `將「長」同「短」嘅${itemData.name}放對位置！`,
        targetA: { id: 'long', label: '長', imgSrc: itemData.longImg, key: itemData.longKey, accepts: 'long_item' },
        targetB: { id: 'short', label: '短', imgSrc: itemData.shortImg, key: itemData.shortKey, accepts: 'short_item' },
        items: [
          { id: 'long_item', imgSrc: itemData.longImg, key: itemData.longKey, label: `長${itemData.name}` },
          { id: 'short_item', imgSrc: itemData.shortImg, key: itemData.shortKey, label: `短${itemData.name}` }
        ],
        isSwapped
      });
    } 
    else if (currentPair === '高矮') {
      const itemData = exemplarPool['高矮'][Math.floor(Math.random() * exemplarPool['高矮'].length)];
      setupDragMatching({
        instruction: `認一認，邊個係「高」，邊個係「矮」？`,
        targetA: { id: 'tall', label: '高', imgSrc: itemData.tallImg, key: itemData.tallKey, accepts: 'tall_item' },
        targetB: { id: 'short', label: '矮', imgSrc: itemData.shortImg, key: itemData.shortKey, accepts: 'short_item' },
        items: [
          { id: 'tall_item', imgSrc: itemData.tallImg, key: itemData.tallKey, label: '高' },
          { id: 'short_item', imgSrc: itemData.shortImg, key: itemData.shortKey, label: '矮' }
        ],
        isSwapped
      });
    } 
    else if (currentPair === '肥瘦') {
      const itemData = exemplarPool['肥瘦'][Math.floor(Math.random() * exemplarPool['肥瘦'].length)];
      setupDragMatching({
        instruction: `邊個係「肥」，邊個係「瘦」？配對看看！`,
        targetA: { id: 'fat', label: '肥', imgSrc: itemData.fatImg, key: itemData.fatKey, accepts: 'fat_item' },
        targetB: { id: 'thin', label: '瘦', imgSrc: itemData.thinImg, key: itemData.thinKey, accepts: 'thin_item' },
        items: [
          { id: 'fat_item', imgSrc: itemData.fatImg, key: itemData.fatKey, label: '肥' },
          { id: 'thin_item', imgSrc: itemData.thinImg, key: itemData.thinKey, label: '瘦' }
        ],
        isSwapped
      });
    } 
    else if (currentPair === '遠近') {
      setupRouteDrawingTrial();
    }
  }

  // DRAG AND DROP ENGINE
  function setupDragMatching(config) {
    currentTrial = config;
    solvedCount = 0;
    document.getElementById('instruction-text').innerText = config.instruction;

    const targetsContainer = document.getElementById('targets-container');
    const sourceArea = document.getElementById('source-area');

    const tA = config.targetA;
    const tB = config.targetB;
    const targets = config.isSwapped ? [tB, tA] : [tA, tB];

    targets.forEach(t => {
      const box = document.createElement('div');
      box.className = 'target-box';
      box.dataset.accepts = t.accepts;

      const imgWrapper = document.createElement('div');
      imgWrapper.className = 'target-img-container';
      imgWrapper.appendChild(createImageElement(t.imgSrc, t.key, t.label));

      const label = document.createElement('div');
      label.className = 'target-label';
      label.innerText = t.label;

      box.appendChild(imgWrapper);
      box.appendChild(label);
      targetsContainer.appendChild(box);
    });

    const shuffledItems = [...config.items].sort(() => Math.random() - 0.5);
    shuffledItems.forEach(item => {
      const dragEl = document.createElement('div');
      dragEl.className = 'draggable-item';
      dragEl.dataset.type = item.accepts || item.id;
      dragEl.appendChild(createImageElement(item.imgSrc, item.key, item.label));
      
      makeDraggable(dragEl);
      sourceArea.appendChild(dragEl);
    });
  }

  function makeDraggable(el) {
    let startX = 0, startY = 0;

    const onStart = (e) => {
      e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      startX = clientX;
      startY = clientY;

      const rect = el.getBoundingClientRect();
      el.style.position = 'fixed';
      el.style.left = rect.left + 'px';
      el.style.top = rect.top + 'px';

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
    };

    const onMove = (e) => {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dx = clientX - startX;
      const dy = clientY - startY;

      el.style.transform = `translate(${dx}px, ${dy}px)`;

      const boxes = document.querySelectorAll('.target-box');
      boxes.forEach(box => {
        const boxRect = box.getBoundingClientRect();
        if (clientX >= boxRect.left && clientX <= boxRect.right &&
            clientY >= boxRect.top && clientY <= boxRect.bottom) {
          box.classList.add('hovered');
        } else {
          box.classList.remove('hovered');
        }
      });
    };

    const onEnd = (e) => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);

      const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

      let droppedOnCorrect = false;
      const boxes = document.querySelectorAll('.target-box');

      boxes.forEach(box => {
        box.classList.remove('hovered');
        const boxRect = box.getBoundingClientRect();
        if (clientX >= boxRect.left && clientX <= boxRect.right &&
            clientY >= boxRect.top && clientY <= boxRect.bottom) {
          
          if (box.dataset.accepts === el.dataset.type) {
            droppedOnCorrect = true;
            box.appendChild(el);
            el.style.position = 'static';
            el.style.transform = 'none';
            el.style.pointerEvents = 'none';
            solvedCount++;

            if (solvedCount >= 2) {
              setTimeout(() => {
                document.getElementById('success-modal').classList.add('show');
              }, 400);
            }
          }
        }
      });

      if (!droppedOnCorrect) {
        el.style.position = 'static';
        el.style.transform = 'none';
      }
    };

    el.addEventListener('mousedown', onStart);
    el.addEventListener('touchstart', onStart, { passive: false });
  }

  // 遠近 ROUTE DRAWING
  function setupRouteDrawingTrial() {
    const instruction = '畫一條路線回家！體會「遠」同「近」！';
    currentTrial = { instruction };
    document.getElementById('instruction-text').innerText = instruction;

    const targetsContainer = document.getElementById('targets-container');
    targetsContainer.innerHTML = `
      <div style="display:flex; justify-content:space-between; width:100%; height:100%; align-items:center; padding: 20px;">
        <div id="person-near" style="text-align:center;">
          ${getFallbackSVG('near_person')}
          <div style="font-weight:bold; color:#2B6CB0; font-size:1.3rem;">近 (Near)</div>
        </div>
        <div id="house-target" style="text-align:center;">
          ${getFallbackSVG('house')}
        </div>
        <div id="person-far" style="text-align:center;">
          ${getFallbackSVG('far_person')}
          <div style="font-weight:bold; color:#E53E3E; font-size:1.3rem;">遠 (Far)</div>
        </div>
      </div>
    `;

    initCanvas();
  }

  function initCanvas() {
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    let drawing = false;

    const startDraw = (e) => {
      drawing = true;
      ctx.beginPath();
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      ctx.moveTo(x, y);
    };

    const draw = (e) => {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      ctx.lineTo(x, y);
      ctx.strokeStyle = '#FF9F43';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.stroke();
    };

    const endDraw = () => {
      if (drawing) {
        drawing = false;
        setTimeout(() => {
          document.getElementById('success-modal').classList.add('show');
        }, 500);
      }
    };

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', endDraw);
  }

  function clearCanvas() {
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
</script>
